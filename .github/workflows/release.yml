name: 🚀 Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'
          cache: 'pip'

      - name: 📦 Install Inno Setup
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: ⚙️ Build Executable & Installer
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_installer.ps1

      - name: 📝 Prepare Release Notes
        id: release_notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $docReleaseFile = "docs/releases/$tag.md"
          
          if (Test-Path $docReleaseFile) {
              Write-Host "Found release note file at $docReleaseFile"
              "BODY_PATH=$docReleaseFile" >> $env:GITHUB_ENV
          } else {
              Write-Host "Release note file not found at $docReleaseFile. Generating summary from git commits..."
              $prevTag = git describe --tags --abbrev=0 "${tag}^" 2>$null
              if ($prevTag) {
                  $commits = git log --oneline "$prevTag..$tag"
              } else {
                  $commits = git log --oneline -n 10
              }
              $fallbackFile = "RELEASE_TEMP_NOTES.md"
              "## What's New in $tag`n`n### 📝 Commits`n" | Out-File $fallbackFile
              $commits | ForEach-Object { "- $_`n" } | Out-File $fallbackFile -Append
              "BODY_PATH=$fallbackFile" >> $env:GITHUB_ENV
          }

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ env.BODY_PATH }}
          files: dist/installer/Document_Converter_Setup_v*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
